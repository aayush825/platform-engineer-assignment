# Nginx reverse proxy for platform-app.
# Nginx terminates client connections and proxies to Gunicorn on loopback.
# In the full AWS design, TLS is terminated at the ALB; this file also shows
# a standalone HTTPS example for a single-EC2 demo with a real domain.

upstream platform_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP: redirect to HTTPS once TLS is configured.
server {
    listen 80;
    server_name app.example.com;

    # Allow ACME HTTP-01 challenge for Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server. Certificate paths are placeholders for the assignment.
server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com;

    # ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Deny access to hidden files such as .env if ever exposed via static paths.
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://platform_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health endpoints reachable by the load balancer / monitoring path.
    location = /health {
        proxy_pass http://platform_app/health;
        access_log off;
    }

    location = /ready {
        proxy_pass http://platform_app/ready;
        access_log off;
    }
}
